<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Writing by Winston Trinh on engineering and design." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://winstontrinh.com/blog/" />
    <!-- Link previews (iMessage, Slack, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Winston Trinh" />
    <meta property="og:title" content="Blog · Winston Trinh" />
    <meta property="og:description" content="Writing by Winston Trinh on engineering and design." />
    <meta property="og:url" content="https://winstontrinh.com/blog/" />
    <meta property="og:image" content="https://winstontrinh.com/og-image.png" />
    <meta property="og:image:width" content="256" />
    <meta property="og:image:height" content="256" />
    <meta property="og:image:alt" content="WT monogram logo" />
    <meta name="twitter:card" content="summary" />
    <title>Blog · Winston Trinh</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root" data-page="index"></div>
    <script type="module" src="/src/blog/main.tsx"></script>
  </body>
</html>
